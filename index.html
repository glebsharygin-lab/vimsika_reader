<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viṃśikā · Parallel Text Laboratory</title>
  <link rel="stylesheet" href="styles.css?v=0.3.0">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <button
        id="sidebarToggle"
        class="sidebar-toggle"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
        title="Collapse navigation"
      >
        <span aria-hidden="true">‹</span>
        <span class="visually-hidden">Collapse navigation</span>
      </button>

      <div class="brand">
        <p class="eyebrow">Parallel Text Laboratory</p>
        <h1>Viṃśikā</h1>
        <p>Vasubandhu · complete text and commentary</p>
      </div>

      <nav class="side-section">
        <div class="section-label">Passages</div>
        <div id="verseNav" class="verse-nav"></div>
      </nav>

      <section class="side-section">
        <div class="section-heading">
          <span class="section-label">Witnesses</span>
          <button id="clearSources" class="text-button" type="button">Clear</button>
        </div>
        <div id="sourceFilters" class="source-filters"></div>
      </section>

      <section class="side-section compact">
        <label class="search-label" for="searchInput">Search selected texts</label>
        <input id="searchInput" class="search-input" type="search" placeholder="e.g. dream, sems, 佛">
      </section>

      <button id="openSources" class="secondary-button" type="button">Sources & rights</button>
    </aside>

    <button
      id="sidebarOpen"
      class="sidebar-open"
      type="button"
      aria-controls="sidebar"
      title="Open navigation"
    >
      <span aria-hidden="true">›</span>
      <span class="visually-hidden">Open navigation</span>
    </button>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local scholarly prototype</p>
          <h2 id="pageTitle">Parallel reading shell</h2>
        </div>
        <div class="view-switch" role="group" aria-label="View mode">
          <button class="view-button active" data-view="reading" type="button">Reading</button>
          <button class="view-button" data-view="comparison" type="button">Comparison</button>
          <button class="view-button" data-view="alignment" type="button">Alignment</button>
          <button class="view-button" data-view="editor" type="button">Editor</button>
        </div>
      </header>

      <div id="notice" class="notice"></div>
      <section id="summary" class="summary-strip"></section>
      <section id="reader" class="reader"></section>
    </main>
  </div>

  <dialog id="sourcesDialog" class="sources-dialog">
    <div class="dialog-heading">
      <div>
        <p class="eyebrow">Provenance ledger</p>
        <h2>Sources & rights</h2>
      </div>
      <button id="closeSources" class="icon-button" type="button" aria-label="Close">×</button>
    </div>
    <div id="sourceLedger" class="source-ledger"></div>
  </dialog>

  <script src="./corpus.js?v=0.3.0"></script>
  <script src="app.js?v=0.3.0"></script>
</body>
</html>
