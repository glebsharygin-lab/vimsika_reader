name = "vimsika-collaboration"
main = "src/index.js"
compatibility_date = "2026-06-14"

[vars]
SITE_URL = "https://glebsharygin-lab.github.io/vimsika_reader"
ADMIN_GITHUB_LOGIN = "glebsharygin-lab"
